name: Fetch Intraday Bars

on:
  # US cash session roughly 14:30–21:00 UTC; grab a few windows on weekdays.
  schedule:
    - cron: "15 15,18,21 * * 1-5"
  workflow_dispatch:

permissions:
  contents: write

# Independent of the daily dataset (separate Kaggle handle / Ready queue).
concurrency:
  group: finance-dataset-kaggle-intraday
  cancel-in-progress: false

jobs:
  fetch-intraday:
    runs-on: ubuntu-latest
    # All shards in one job: one Kaggle pull + one publish (not per shard).
    timeout-minutes: 480

    steps:
      - name: Free disk space
        run: |
          sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc \
            /usr/local/share/boost "$AGENT_TOOLSDIRECTORY" || true
          df -h /

      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Pull latest intradaily Kaggle dataset
        env:
          KAGGLE_API_TOKEN: ${{ secrets.KAGGLE_API_TOKEN }}
        run: python scripts/pull_kaggle.py --slice intraday --optional

      - name: Fetch all intradaily shards
        run: >
          python scripts/run_intraday_shards.py
          --summary-path artifacts/fetch-summary.json

      - name: Upload fetch summary
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: fetch-summary-intraday
          path: |
            artifacts/fetch-summary.json
            artifacts/fetch-summary.md
          if-no-files-found: warn

      - name: Publish intradaily OHLCV to Kaggle
        env:
          KAGGLE_API_TOKEN: ${{ secrets.KAGGLE_API_TOKEN }}
        run: >
          python scripts/publish_kaggle.py
          --slice intraday
          --version-notes "Intraday refresh (1m–1h, full universe)"

      - name: Commit listing updates
        env:
          GIT_AUTHOR_NAME: github-actions[bot]
          GIT_AUTHOR_EMAIL: 41898282+github-actions[bot]@users.noreply.github.com
          GIT_COMMITTER_NAME: github-actions[bot]
          GIT_COMMITTER_EMAIL: 41898282+github-actions[bot]@users.noreply.github.com
        run: python scripts/batch_commit.py --batch-size 100
